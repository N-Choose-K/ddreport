[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# Flag unmaintained crates only when ddreport depends on them directly; typst
# 0.15 pins several transitively (bincode, paste, rustybuzz, ttf-parser, yaml).
unmaintained = "workspace"
ignore = [
  # quick-xml 0.38 via typst-library -> hayagriva -> citationberg; the only
  # XML parsed is typst's own bundled CSL data, never user input. Clear when
  # typst moves to quick-xml >= 0.41.
  { id = "RUSTSEC-2026-0194", reason = "quick-xml pinned by typst 0.15; parses bundled CSL data only" },
  { id = "RUSTSEC-2026-0195", reason = "quick-xml pinned by typst 0.15; parses bundled CSL data only" },
]

[licenses]
version = 2
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Unlicense",
  "WTFPL",
  "Zlib",
]

[bans]
multiple-versions = "allow"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
