[package]
name = "ddreport"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "One-page drive health report PDF from SMART data"
license = "MIT"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
crossterm = "0.29"
gethostname = "1"
humansize = "2"
nusb = "0.2"
plist = "1"
ratatui = "0.30"
rusb = { version = "0.9.4", features = ["vendored"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thousands = "0.2"
typst = "0.15"
typst-as-lib = "0.17"
typst-layout = "0.15"
typst-pdf = "0.15"

[profile.dev.package."*"]
opt-level = 2

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
io-kit-sys = "0.5"
