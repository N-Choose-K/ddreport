[package]
name = "ddreport"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "One-page drive health report PDF from SMART data"
license = "MIT"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
gethostname = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
typst = "0.15"
typst-as-lib = "0.17"
typst-pdf = "0.15"
typst-layout = "0.15"
humansize = "2"
thousands = "0.2"

[profile.dev.package."*"]
opt-level = 2

[target.'cfg(unix)'.dependencies]
libc = "0.2"
